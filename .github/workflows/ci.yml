name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run core tests
        run: swift test

      - name: Run UI state checks
        run: bash scripts/verify-ui-boundaries.sh

      - name: Build signed app archive
        run: bash scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/Project Sweep.app"

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSweep-macOS-arm64
          path: dist/ProjectSweep-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
