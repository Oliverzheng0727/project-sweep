name: Feature request
description: Propose a focused improvement to Project Sweep.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the cleanup problem and the safety boundary the feature should preserve. Do not include private project or conversation content.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible flow and the expected result.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Project cleanup
        - Local AI tool data
        - Skills management
        - Recovery and records
        - Accessibility or appearance
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility
      description: Explain what must remain protected and which tool or storage versions matter.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or designs you considered.
